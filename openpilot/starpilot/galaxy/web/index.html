<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6f42a6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Galaxy">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Galaxy</title>
  <link rel="icon" type="image/svg+xml" href="./assets/galaxy-icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/galaxy-icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials">
  <link rel="stylesheet" href="./vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./css/galaxy.css">
  <link rel="stylesheet" href="./css/settings.css">
  <link rel="stylesheet" href="./css/navigation.css">
  <link rel="stylesheet" href="./css/menu.css">
  <link rel="stylesheet" href="./css/model-list.css">
</head>
<body>
  <div id="galaxy-bg" aria-hidden="true"></div>
  <section id="galaxy-boot" class="gx-boot" role="status">
    <img class="gx-boot__logo" src="./assets/galaxy-icon.svg" width="160" height="160" alt="" /><h1>Galaxy</h1><div class="gx-boot__orbit" aria-hidden="true"></div><p>Plotting the stars...</p><button type="button" class="gx-icon-btn" aria-label="Refresh Galaxy" title="Refresh Galaxy" hidden><i class="bi bi-arrow-clockwise" aria-hidden="true"></i></button>
    <noscript>Enable JavaScript to open Galaxy.</noscript>
  </section>
  <div id="galaxy-app" v-cloak></div>
  <script type="module" src="./js/boot.js"></script>
</body>
</html>
