name: HKG angle recovery qualification
on:
  push:
    branches: [codex/hkg-angle-retention-20261106]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      SCALE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Fetch exact baseline source
        run: git -c gc.auto=0 -c maintenance.auto=false fetch --no-tags --depth=1 --filter=blob:none origin 68434cf39c501604fe962e9488a03bde0fed0d73
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.1'
          cache-dependency-path: mapd_repo/go.sum
      - name: Fetch pinned map provider dependencies
        working-directory: mapd_repo
        env:
          GOTOOLCHAIN: local
        run: go mod download
      - run: ./tools/op.sh setup
      - name: Build matching Linux dependencies
        run: >-
          .venv/bin/scons -j2
          openpilot/common/libparams_c.so
          msgq_repo/msgq/_ipc.so
          msgq_repo/msgq/visionipc/_visionipc.so
          opendbc_repo/opendbc/can/_raw_value.so
          opendbc_repo/opendbc/dbc
          openpilot/selfdrive/controls/lib/longitudinal_mpc_lib/c_generated_code/acados_ocp_solver_pyx.so
          openpilot/selfdrive/locationd/models/generated/libcar.so
      - name: Require the original split-delivery failure
        shell: bash
        run: |
          .venv/bin/python - <<'PYCODE'
          from pathlib import Path
          import subprocess, xml.etree.ElementTree as ET, json
          path=Path('openpilot/starpilot/aol/temporary_steering.py')
          shipping=path.read_bytes()
          transport=Path('openpilot/starpilot/aol/transport_pause.py')
          transport_shipping=transport.read_bytes()
          transport_original=subprocess.check_output(['git','show','68434cf39c501604fe962e9488a03bde0fed0d73:openpilot/starpilot/aol/transport_pause.py'])
          original=subprocess.check_output(['git','show','68434cf39c501604fe962e9488a03bde0fed0d73:openpilot/starpilot/aol/temporary_steering.py'])
          try:
            path.write_bytes(original)
            transport.write_bytes(transport_original)
            result=subprocess.run(['.venv/bin/python','-m','pytest','-q','openpilot/starpilot/aol/tests/test_hkg_angle_eps_retention.py','-k','split_publications or stopped_full_request','--junitxml=baseline.xml'])
            root=ET.parse('baseline.xml').getroot()
            cases=list(root.iter('testcase')); failed=[c for c in cases if c.find('failure') is not None]
            assert result.returncode==1 and len(failed)==8 and not list(root.iter('error'))
            assert all(any(marker in ''.join(c.find('failure').itertext()) for marker in ('NATIVE_FIRST_EPS_DISARMED','STOPPED_FULL_REQUEST_DISARMED')) for c in failed)
            Path('baseline-result.json').write_text(json.dumps({'cases':len(cases),'expectedFailures':len(failed),'confirmed':True}))
          finally:
            path.write_bytes(shipping)
            transport.write_bytes(transport_shipping)
          assert path.read_bytes()==shipping
          PYCODE
      - name: Run steering retention and independent safety veto regressions
        run: |
          .venv/bin/python -m pytest -q --junitxml=qualification.xml             openpilot/starpilot/aol/tests/test_hkg_angle_eps_retention.py             openpilot/starpilot/aol/tests/test_pe_combined_profile_contract.py             openpilot/starpilot/aol/tests/test_stock_eps_recovery.py             openpilot/starpilot/aol/tests/test_runtime.py             openpilot/starpilot/aol/tests/test_source_pause_driver_monitoring.py             openpilot/system/hardware/tests             openpilot/starpilot/drive_state/tests/test_hardware_lifecycle.py
      - name: Check owned Python files
        run: |
          .venv/bin/ruff check openpilot/starpilot/aol/temporary_steering.py openpilot/starpilot/aol/tests/test_hkg_angle_eps_retention.py openpilot/starpilot/aol/transport_pause.py openpilot/system/hardware/hardwared.py openpilot/system/hardware/hardware_timing.py openpilot/system/hardware/tests/test_hardware_timing.py
          .venv/bin/ty check openpilot/starpilot/aol/temporary_steering.py openpilot/starpilot/aol/tests/test_hkg_angle_eps_retention.py openpilot/starpilot/aol/transport_pause.py openpilot/system/hardware/hardwared.py openpilot/system/hardware/hardware_timing.py openpilot/system/hardware/tests/test_hardware_timing.py
      - name: Save exact results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hkg-angle-recovery-results
          path: |
            baseline.xml
            baseline-result.json
            qualification.xml
